<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Tracker Sekolah</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">
        <h2>How are you feeling</h2>
        
        <form id="emotionForm">
            <div class="form-group">
                <label>Full name:</label>
                <input type="text" id="nama" placeholder="Input your name..." required>
            </div>

            <div class="form-group">
                <label>Choose Grade:</label>
                <select id="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="7A">7A</option>
                    <option value="7B">7B</option>
                    <option value="10A">10A</option>
                    <option value="10B">10B</option>
                </select>
            </div>

            <div class="form-group">
                <label>Choose the emotion:</label>
                <div class="emotion-container">
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="senang_banget" value="Senang Banget" required>
                        <label for="senang_banget" class="emotion-label">
                            <span>🤩</span><p>Very Happy</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="senang" value="Senang">
                        <label for="senang" class="emotion-label">
                            <span>😊</span><p>Happy</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="biasa" value="Biasa Saja">
                        <label for="biasa" class="emotion-label">
                            <span>😐</span><p>Normal</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="kecewa" value="Kecewa">
                        <label for="kecewa" class="emotion-label">
                            <span>😞</span><p>Dissapointed</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="sedih" value="Sedih">
                        <label for="sedih" class="emotion-label">
                            <span>😭</span><p>Sad</p>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Tell me more detail:</label>
                <textarea id="cerita" rows="4" placeholder="Tuliskan kejadian hari ini yang membuat mu memilih emosi itu..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Submit</button>
        </form>
    </div>

    <script src="/js/script.js">
        
    </script>
</body>
</html>
