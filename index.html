<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Tracker Sekolah</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="container">
        <h2>Bagaimana Perasaanmu Hari Ini?</h2>
        
        <form id="emotionForm">
            <div class="form-group">
                <label>Nama Lengkap:</label>
                <input type="text" id="nama" placeholder="Masukkan namamu..." required>
            </div>

            <div class="form-group">
                <label>Pilih Kelas:</label>
                <select id="kelas" required>
                    <option value="">-- Pilih Kelas --</option>
                    <option value="7A">7A</option>
                    <option value="7B">7B</option>
                    <option value="8A">8A</option>
                    <option value="8B">8B</option>
                    <option value="9A">9A</option>
                    <option value="9B">9B</option>
                </select>
            </div>

            <div class="form-group">
                <label>Pilih Emosi Hari Ini:</label>
                <div class="emotion-container">
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="senang_banget" value="Senang Banget" required>
                        <label for="senang_banget" class="emotion-label">
                            <span>🤩</span><p>SENANG BANGET</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="senang" value="Senang">
                        <label for="senang" class="emotion-label">
                            <span>😊</span><p>SENANG</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="biasa" value="Biasa Saja">
                        <label for="biasa" class="emotion-label">
                            <span>😐</span><p>BIASA</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="kecewa" value="Kecewa">
                        <label for="kecewa" class="emotion-label">
                            <span>😞</span><p>KECEWA</p>
                        </label>
                    </div>
                    <div class="emotion-option">
                        <input type="radio" name="emosi" id="sedih" value="Sedih">
                        <label for="sedih" class="emotion-label">
                            <span>😭</span><p>SEDIH</p>
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Ceritakan Detail Harimu:</label>
                <textarea id="cerita" rows="4" placeholder="Tuliskan pengalaman atau kejadian hari ini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">KIRIM DATA KE EXCEL</button>
        </form>
    </div>

    <script>
        document.getElementById('emotionForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman reload

            // Mengambil data dari form
            const nama = document.getElementById('nama').value;
            const kelas = document.getElementById('kelas').value;
            const emosi = document.querySelector('input[name="emosi"]:checked').value;
            // Membersihkan teks cerita dari enter/koma agar format Excel tidak rusak
            const cerita = document.getElementById('cerita').value.replace(/(\r\n|\n|\r|,)/gm, " "); 
            const tanggal = new Date().toLocaleString('id-ID');

            // Membuat baris data format CSV (Excel)
            const csvContent = `Tanggal,Nama,Kelas,Emosi,Cerita\n"${tanggal}","${nama}","${kelas}","${emosi}","${cerita}"`;

            // Proses download file CSV
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            
            link.setAttribute("href", url);
            link.setAttribute("download", `Data_Emosi_${nama}.csv`);
            link.style.visibility = 'hidden';
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // Reset form setelah dikirim
            alert("Data berhasil disimpan! File Excel (CSV) otomatis terdownload.");
            this.reset();
        });
    </script>
</body>
</html>
